<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardiGo | Your AI Cardiovascular Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #E63946;
            --secondary: #1D3557;
            --accent: #457B9D;
            --light: #F1FAEE;
            --white: #FFFFFF;
            --bg-gradient: linear-gradient(135deg, #1D3557 0%, #457B9D 100%);
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Decorative background elements */
        .decor-circle {
            position: absolute;
            background: var(--glass);
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
        }

        .circle-1 { width: 500px; height: 500px; top: -10%; left: -10%; background: rgba(230, 57, 70, 0.15); }
        .circle-2 { width: 400px; height: 400px; bottom: -5%; right: -5%; background: rgba(69, 123, 157, 0.2); }

        .app-container {
            width: 90%;
            max-width: 500px;
            height: 80vh;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            border: 1px solid var(--glass-border);
            z-index: 10;
            overflow: hidden;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            padding: 20px 24px;
            background: var(--white);
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-ring {
            width: 44px;
            height: 44px;
            background: var(--primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(230, 57, 70, 0.3);
        }

        .logo-ring svg {
            width: 24px;
            height: 24px;
            fill: white;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .header-info h1 {
            font-size: 1.25rem;
            color: var(--secondary);
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
        }

        .header-info p {
            font-size: 0.75rem;
            color: #777;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #10B981;
            border-radius: 50%;
            display: inline-block;
        }

        #chat {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--accent) transparent;
        }

        #chat::-webkit-scrollbar { width: 6px; }
        #chat::-webkit-scrollbar-thumb { background-color: rgba(0,0,0,0.1); border-radius: 10px; }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.5;
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .user-msg {
            align-self: flex-end;
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 12px rgba(230, 57, 70, 0.2);
        }

        .bot-msg {
            align-self: flex-start;
            background: #f0f2f5;
            color: var(--secondary);
            border-bottom-left-radius: 4px;
        }

        .input-area {
            padding: 20px;
            background: var(--white);
            display: flex;
            gap: 12px;
            border-top: 1px solid #eee;
        }

        input {
            flex: 1;
            padding: 12px 18px;
            border-radius: 30px;
            border: 2px solid #efefef;
            outline: none;
            font-size: 0.95rem;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(230, 57, 70, 0.1);
        }

        button {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: var(--primary);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background 0.3s;
            box-shadow: 0 4px 10px rgba(230, 57, 70, 0.3);
        }

        button:hover {
            transform: scale(1.05);
            background: #D62828;
        }

        button:active {
            transform: scale(0.95);
        }

        .typing {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background: #f0f2f5;
            border-radius: 18px;
            width: fit-content;
            margin-bottom: 10px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: #aaa;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        .disclaimer {
            font-size: 0.7rem;
            color: #999;
            text-align: center;
            padding: 10px 20px;
            background: #f8f9fa;
        }
    </style>
</head>
<body>

    <div class="decor-circle circle-1"></div>
    <div class="decor-circle circle-2"></div>

    <div class="app-container">
        <header>
            <div class="logo-ring">
                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </div>
            <div class="header-info">
                <h1>CardiGo AI</h1>
                <p><span class="status-dot"></span> Heart Health Advisor Online</p>
            </div>
        </header>

        <div id="chat">
            <div class="message bot-msg">👋 Hello! I am CardiGo, your cardiovascular assistant. How can I help you understand your heart health today?</div>
        </div>

        <div id="typing-indicator" style="display: none; padding: 0 20px;">
            <div class="typing">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="input" placeholder="Ask about blood pressure, diet, etc..." onkeypress="if(event.key==='Enter') send()">
            <button onclick="send()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>

        <div class="disclaimer">
            CardiGo is an AI and not a medical doctor. Always consult a professional for medical advice.
        </div>
    </div>

    <script>
        const chatDiv = document.getElementById("chat");
        const typingIndicator = document.getElementById("typing-indicator");
        const inputField = document.getElementById("input");

        async function send() {
            const message = inputField.value.trim();
            if (!message) return;

            // Add user message
            appendMessage(message, 'user');
            inputField.value = "";

            // Show typing indicator
            typingIndicator.style.display = "block";
            chatDiv.scrollTop = chatDiv.scrollHeight;

            try {
                const res = await fetch("http://localhost:5000/chat", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ message })
                });

                const data = await res.json();
                
                // Hide typing indicator and add bot response
                typingIndicator.style.display = "none";
                if (data.reply) {
                    appendMessage(data.reply, 'bot');
                } else {
                    appendMessage("Sorry, I encountered an error. Please try again.", 'bot');
                }
            } catch (err) {
                typingIndicator.style.display = "none";
                appendMessage("Connection error. Is the server running?", 'bot');
                console.error(err);
            }
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${sender}-msg`;
            msgDiv.innerText = text;
            chatDiv.appendChild(msgDiv);
            chatDiv.scrollTop = chatDiv.scrollHeight;
        }
    </script>
</body>
</html>
